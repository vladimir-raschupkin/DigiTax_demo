ption":"A description of the invoice type as defined by UN/CEFACT","example":"Document/message claiming payment for goods or services supplied under conditions agreed between seller and buyer."},"invoice_category":{"type":"string","description":"Indicates whether this code represents an invoice or a credit note","enum":["INVOICE","CREDIT_NOTE"],"example":"INVOICE"},"valid_for_regular":{"type":"boolean","description":"Indicates whether this invoice type is valid for regular invoices","example":true},"valid_for_self_billed":{"type":"boolean","description":"Indicates whether this invoice type is valid for self-billed invoices","example":false}}},"TaxCategory":{"type":"object","required":["code","name","description","has_rate","tax_rate"],"properties":{"code":{"type":"string","description":"The code identifier","example":"S"},"name":{"type":"string","description":"The human-readable name of the code","example":"Standard rate"},"description":{"type":"string","description":"An optional longer description of what this code means","example":"Code specifying the standard rate"},"tax_rate":{"type":"number","format":"double","example":0.05,"nullable":true,"description":"The tax rate(between 0 and 1) applied to the category for tax categories that have a defined rate"},"has_rate":{"type":"boolean","example":true,"description":"Indicates whether the tax category has a rate defined"}}},"Address":{"type":"object","description":"Postal address","required":["street_name","city_name","country_subentity","country_code"],"properties":{"street_name":{"type":"string","description":"The main address line (street name, building number)","example":"Sheikh Zayed Road, Tower 1"},"additional_street_name":{"type":"string","description":"An additional address line","example":"Floor 22"},"city_name":{"type":"string","description":"The city of the address","example":"Dubai"},"postal_zone":{"type":"string","description":"The postal zone or postcode","example":"00000"},"country_subentity":{"type":"s