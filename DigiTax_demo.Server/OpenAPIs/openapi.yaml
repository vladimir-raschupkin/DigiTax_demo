{"openapi":"3.0.1","info":{"title":"DigiTax UAE API Endpoints","description":"DigiTax UAE Public API — Peppol PINT-AE compliant e-invoicing.","version":"3","termsOfService":"https://digitax.tech/page/terms","contact":{"name":"DigiTax","url":"https://digitax.tech","email":"support@namiri.tech"},"license":{"name":"Apache 2.0"}},"servers":[{"url":"https://api.digitax.tech/ae/v1","description":"API"}],"paths":{"/resources/countries":{"get":{"tags":["Resources"],"summary":"Get UAE Countries","description":"Returns the list of supported countries based on the ISO 3166-1 alpha-2 code list used in PINT-AE.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of countries","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/Country"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/currencies":{"get":{"tags":["Resources"],"summary":"Get UAE Currencies","description":"Returns the list of supported currencies based on ISO 4217.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of currencies","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CommonCode"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/tax-categories":{"get":{"tags":["Resources"],"summary":"Get UAE Tax Categories","description":"Returns the list of VAT category codes applicable in the UAE under the PINT-AE specification.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of tax category codes","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/TaxCategory"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/invoice-types":{"get":{"tags":["Resources"],"summary":"Get UAE Invoice Types","description":"Returns the list of invoice type codes (UN/CEFACT UNCL1001 subset) supported in PINT-AE.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of invoice type codes","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/InvoiceType"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/payment-means":{"get":{"tags":["Resources"],"summary":"Get UAE Payment Means","description":"Returns the list of payment means codes (UN/CEFACT UNCL4461) supported in PINT-AE.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of payment means codes","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CommonCode"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/commodity-codes":{"get":{"tags":["Resources"],"summary":"Get UAE Commodity Codes","description":"Returns the list of item type/commodity codes supported in PINT-AE.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of commodity codes","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CommonCode"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/hs-codes":{"get":{"tags":["Resources"],"summary":"Get UAE HS Codes","description":"Returns the HS codes of the GCC Integrated Customs Tariff (12 digits, HS 2022 based) as published by UAE customs. Use a `code` as the item `hs_code`.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of HS codes","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CommonCode"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/service-codes":{"get":{"tags":["Resources"],"summary":"Get UAE Service Codes","description":"Returns suggested service accounting codes, taken from the services divisions (5-9) of the UN Central Product Classification (CPC) Version 2.1, because the Ministry of Finance has not published a service code list. Use a `code` as the item `service_accounting_code`.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of service accounting codes","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CommonCode"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/item-classification-list":{"get":{"tags":["Resources"],"summary":"Get UAE Item Classification List","description":"Returns the valid item classification list identifiers (BT-158-scheme-id) supported in PINT-AE.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of item classification list codes","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CommonCode"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/international-code-designator-schemes":{"get":{"tags":["Resources"],"summary":"Get the ISO 6523 International Code Designator Schemes","description":"Returns the list of international code designator schemes supported in PINT-AE.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of international code designator scheme codes","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CommonCode"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/electronic-address-schemes":{"get":{"tags":["Resources"],"summary":"Get the Peppol Electronic Address Scheme (EAS) codes","description":"Returns the list of Peppol EAS codes usable as a party's `peppol_id_scheme`.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of Peppol EAS codes","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CommonCode"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/tax-exemption-reasons":{"get":{"tags":["Resources"],"summary":"Get UAE Tax Exemption Reason Codes","description":"Returns the list of VAT exemption reason codes applicable in PINT-AE.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of tax exemption reason codes","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CommonCode"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/credit-reasons":{"get":{"tags":["Resources"],"summary":"Get UAE Credit Note Reason Codes","description":"Returns the list of valid reason codes for credit notes as specified by the UAE FTA.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of credit note reason codes","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CommonCode"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/billing-frequencies":{"get":{"tags":["Resources"],"summary":"Get UAE Billing Frequency Codes","description":"Returns the list of billing frequency codes used in invoice periods under PINT-AE.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of billing frequency codes","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CommonCode"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/units-of-measure":{"get":{"tags":["Resources"],"summary":"Get UAE Units of Measure","description":"Returns the list of UN/ECE Recommendation 20 unit of measure codes supported in PINT-AE.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of unit of measure codes","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CommonCode"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/allowance-reasons":{"get":{"tags":["Resources"],"summary":"Get UAE Allowance Reason Codes","description":"Returns the list of allowance reason codes (UN/CEFACT UNCL5189) supported in PINT-AE.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of allowance reason codes","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CommonCode"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/charge-reasons":{"get":{"tags":["Resources"],"summary":"Get UAE Charge Reason Codes","description":"Returns the list of charge reason codes (UN/CEFACT UNCL7161) supported in PINT-AE.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of charge reason codes","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CommonCode"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/goods-types":{"get":{"tags":["Resources"],"summary":"Get UAE Goods Types","description":"Returns the list of goods type codes for items subject to reverse charge mechanism (RCM) in PINT-AE.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of goods type codes","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CommonCode"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/delivery-location-schemes":{"get":{"tags":["Resources"],"summary":"Get UAE Delivery Location Schemes","description":"Returns the list of delivery location schemes used in UAE e-invoices.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of delivery location schemes","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CommonCode"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/ae-country-subentities":{"get":{"tags":["Resources"],"summary":"Get UAE Country Subentities","description":"Returns the list of country subentities in the UAE.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of AE country subentities","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/CommonCode"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/resources/legal-registration-types":{"get":{"tags":["Resources"],"summary":"Get UAE Legal Registration Types","description":"Returns the list of legal registration identifier types used to classify a company identifier — e.g. Trade License, Emirates ID, Passport.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"List of legal registration type codes","content":{"application/json":{"schema":{"type":"array","items":{"$ref":"#/components/schemas/LegalRegistrationType"}}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/info":{"get":{"tags":["Business"],"summary":"Get UAE Business Info","description":"Returns information about the business as registered on DigiTax.","security":[{"apiKeyAuth":[]}],"responses":{"200":{"description":"Branch info","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Branch"}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/parties":{"get":{"tags":["Parties"],"summary":"Get UAE Parties","description":"Returns a paginated list of parties registered under the authenticated business.","security":[{"apiKeyAuth":[]}],"parameters":[{"$ref":"#/components/parameters/Before"},{"$ref":"#/components/parameters/After"},{"$ref":"#/components/parameters/PageSize"}],"responses":{"200":{"description":"List of parties","content":{"application/json":{"schema":{"type":"object","required":["data","cursor"],"properties":{"data":{"type":"array","items":{"$ref":"#/components/schemas/Party"}},"cursor":{"$ref":"#/components/schemas/Pagination"}}}}}},"default":{"$ref":"#/components/responses/Error"}}},"post":{"tags":["Parties"],"summary":"Create a UAE business Party","description":"Creates a new party for use in UAE e-invoices.","security":[{"apiKeyAuth":[]}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"allOf":[{"$ref":"#/components/schemas/PartyTaxpayer"},{"type":"object","properties":{"public_metadata":{"type":"string","maxLength":100,"description":"Free-form text to attach to this resource, such as your own reference or a JSON string, up to 100 characters. Digitax stores it as given and returns it as `public_metadata` on the resource. Set at creation only."}}}]}}}},"responses":{"201":{"description":"Created party","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Party"}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/parties/{party_id}":{"get":{"tags":["Parties"],"summary":"Get a UAE business party","description":"Retrieves information about a party given their ID on DigiTax","security":[{"apiKeyAuth":[]}],"parameters":[{"in":"path","name":"party_id","required":true,"schema":{"type":"string","example":"party_01HC3J1VVVM05YCTS61G7V3KC6"}}],"responses":{"200":{"description":"Success","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Party"}}}},"default":{"$ref":"#/components/responses/Error"}}},"put":{"tags":["Parties"],"summary":"Update a UAE business party","description":"Updates party information given their ID on DigiTax.\n\nWhen `legal_entity` is sent, it replaces the party's legal entity in full: send every field you want to keep, as any field left out is cleared. Leave `legal_entity` out to keep it unchanged.\n","security":[{"apiKeyAuth":[]}],"parameters":[{"in":"path","name":"party_id","required":true,"schema":{"type":"string","description":"Party ID on DigiTax","example":"party_01HC3J1VVVM05YCTS61G7V3KC6"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"legal_entity":{"$ref":"#/components/schemas/PartyLegalEntity"},"address":{"$ref":"#/components/schemas/Address"},"contact_name":{"type":"string","description":"The updated contact person name","example":"Sara Ahmed"},"contact_phone":{"type":"string","description":"The updated contact phone number in E.164 format","example":"+971501112222"},"contact_email":{"type":"string","format":"email","description":"The updated contact email address","example":"sara.ahmed@global-imports.ae"},"uae_registered":{"type":"boolean","nullable":true,"description":"Whether the party holds a UAE Tax Identification Number with the FTA, with the same meaning as on create. Omit it, or send `null`, to keep the current value. `true` needs a UAE-format TIN, and a complete `legal_entity` unless the party has a `peppol_id_scheme` other than `0235` (send `legal_entity` in the same request when needed). `false` is rejected for a party with a TRN or addressed under `peppol_id_scheme` `0235`.\n","example":true}}}}}},"responses":{"200":{"description":"Party updated","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Party"}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/items":{"get":{"tags":["Items"],"summary":"Get UAE Items","description":"Returns a paginated list of business items","security":[{"apiKeyAuth":[]}],"parameters":[{"$ref":"#/components/parameters/Before"},{"$ref":"#/components/parameters/After"},{"$ref":"#/components/parameters/PageSize"}],"responses":{"200":{"description":"A list of items","content":{"application/json":{"schema":{"type":"object","required":["data","cursor"],"properties":{"data":{"type":"array","items":{"$ref":"#/components/schemas/Item"}},"cursor":{"$ref":"#/components/schemas/Pagination"}}}}}},"default":{"$ref":"#/components/responses/Error"}}},"post":{"tags":["Items"],"summary":"Create a UAE Item","description":"Creates a new item that can be referenced in UAE e-invoices.","security":[{"apiKeyAuth":[]}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["name","description","commodity_code","tax_category_code"],"properties":{"public_metadata":{"type":"string","maxLength":100,"description":"Free-form text to attach to this resource, such as your own reference or a JSON string, up to 100 characters. Digitax stores it as given and returns it as `public_metadata` on the resource. Set at creation only."},"name":{"type":"string","description":"The name of the item","example":"Industrial Pump Model X-500"},"description":{"type":"string","description":"A description of the item","example":"High-pressure centrifugal pump for industrial fluid transfer"},"commodity_code":{"type":"string","description":"The commodity type code (G for goods, S for services, B for both). See `GET /resources/commodity-codes` for available values.","example":"G"},"hs_code":{"type":"string","description":"The Harmonized System (HS) code for the item. Required when commodity_code is G (goods) or B (both goods and services). See `GET /resources/hs-codes` for the GCC Integrated Customs Tariff codes (12 digits, no separators); the value is not validated against that list yet.","example":"841370000001"},"service_accounting_code":{"type":"string","description":"The Service Accounting Code for the item. Required when commodity_code is S (services) or B (both goods and services). See `GET /resources/service-codes` for suggested values (UN CPC Version 2.1 service codes); the value is not validated against that list yet.","example":"83111"},"tax_category_code":{"type":"string","description":"The VAT category code for this item. See `GET /resources/tax-categories` for available values.","example":"S"},"item_code":{"type":"string","description":"A unique code assigned to the item in the user's system. It will be used as the unique product identifier","example":"PUMP-X500-BLK"},"standard_item_id":{"type":"string","description":"A standardised item identifier","example":"09501101530003"},"standard_item_scheme":{"type":"string","description":"The scheme for the standard item identifier. See `GET /resources/international-code-designator-schemes` for available values.","example":"0160"},"origin_country_code":{"type":"string","description":"The ISO 3166-1 alpha-2 code of the item's country of origin. See `GET /resources/countries` for available values.","example":"DE"},"item_properties":{"type":"array","description":"Additional item attributes","items":{"$ref":"#/components/schemas/ItemProperty"}}}}}}},"responses":{"201":{"description":"Item created","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Item"}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/items/{item_id}":{"get":{"tags":["Items"],"summary":"Get a UAE Item","description":"Retrieves information about an item given its ID on DigiTax.","security":[{"apiKeyAuth":[]}],"parameters":[{"in":"path","name":"item_id","required":true,"schema":{"type":"string","description":"Item ID on DigiTax","example":"item_01HC3J1VVVM05YCTS61G7V3KC6"}}],"responses":{"200":{"description":"Success","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Item"}}}},"default":{"$ref":"#/components/responses/Error"}}},"put":{"tags":["Items"],"summary":"Update a UAE Item","description":"Updates an item given its ID on DigiTax. Only the fields you send change; fields you leave out keep their current value.\n\nFor `hs_code`, `service_accounting_code`, `standard_item_id`, `standard_item_scheme` and `origin_country_code`, send an empty string to clear the value, as long as the item stays valid (for example, an item with a commodity code of goods needs its `hs_code`, and `standard_item_id` and `standard_item_scheme` are cleared together). `name`, `description`, `commodity_code` and `item_code` cannot be cleared. When sent, `item_properties` replaces the item's properties in full.\n\nThe commodity, HS code and service accounting code rules are the same as on create and are checked against the item as it will be after the update, so changing `commodity_code` usually means sending the matching codes in the same request.\n\n`item_code` can only be set on an item that has none yet, and returns an error if the code is already used by another item. It cannot be changed afterwards.\n\nInvoices already created keep the item details they were issued with.\n","security":[{"apiKeyAuth":[]}],"parameters":[{"in":"path","name":"item_id","required":true,"schema":{"type":"string","description":"Item ID on DigiTax","example":"item_01HC3J1VVVM05YCTS61G7V3KC6"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","properties":{"name":{"type":"string","description":"The name of the item","example":"Industrial Pump Model X-500"},"description":{"type":"string","description":"A description of the item","example":"High-pressure centrifugal pump for industrial fluid transfer"},"commodity_code":{"type":"string","description":"The commodity type code (G for goods, S for services, B for both). See `GET /resources/commodity-codes` for available values.","example":"G"},"hs_code":{"type":"string","description":"The Harmonized System (HS) code for the item. Required when commodity_code is G or B, and not allowed when it is S. See `GET /resources/hs-codes`.","example":"841370000001"},"service_accounting_code":{"type":"string","description":"The Service Accounting Code for the item. Required when commodity_code is S or B, and not allowed when it is G. See `GET /resources/service-codes`.","example":"83111"},"item_code":{"type":"string","description":"A unique code assigned to the item in your system. Can only be set when the item has no item code yet.","example":"PUMP-X500-BLK"},"standard_item_id":{"type":"string","description":"A standardised item identifier. Needs `standard_item_scheme`.","example":"09501101530003"},"standard_item_scheme":{"type":"string","description":"The scheme for the standard item identifier. See `GET /resources/international-code-designator-schemes` for available values.","example":"0160"},"origin_country_code":{"type":"string","description":"The ISO 3166-1 alpha-2 code of the item's country of origin. See `GET /resources/countries` for available values.","example":"DE"},"item_properties":{"type":"array","description":"Additional item attributes. Replaces the existing properties in full.","items":{"$ref":"#/components/schemas/ItemProperty"}}}}}}},"responses":{"200":{"description":"Item updated","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Item"}}}},"default":{"$ref":"#/components/responses/Error"}}}},"/invoices":{"get":{"tags":["Invoices"],"summary":"Get UAE Invoices","description":"Returns a paginated list of all invoices created by the business","security":[{"apiKeyAuth":[]}],"parameters":[{"$ref":"#/components/parameters/Before"},{"$ref":"#/components/parameters/After"},{"$ref":"#/components/parameters/PageSize"}],"responses":{"200":{"description":"A list of invoices","content":{"application/json":{"schema":{"type":"object","required":["data","cursor"],"properties":{"data":{"type":"array","items":{"$ref":"#/components/schemas/Invoice"}},"cursor":{"$ref":"#/components/schemas/Pagination"}}}}}},"default":{"$ref":"#/components/responses/Error"}}},"post":{"tags":["Invoices"],"summary":"Create a UAE Invoice","description":"Creates a new PINT-AE compliant e-invoice and submits it to the Peppol network.","security":[{"apiKeyAuth":[]}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"type":"object","required":["trader_invoice_number","invoice_type_code","issue_date","document_currency_code","customer_party_id","items","payments"],"properties":{"public_metadata":{"type":"string","maxLength":100,"description":"Free-form text to attach to this resource, such as your own reference or a JSON string, up to 100 characters. Digitax stores it as given and returns it as `public_metadata` on the resource. Set at creation only."},"trader_invoice_number":{"type":"string","description":"An issuer-assigned invoice number, unique within the business. When given, this is the document number sent over Peppol; otherwise, the DigiTax-generated number is used. Must contain valid Unicode and XML characters, with no leading or trailing whitespace, tabs, or line breaks","example":"ACME-INV-2024-0042"},"transaction_types":{"type":"array","description":"The list of applicable PINT-AE transaction types","items":{"type":"string","enum":["FREE_TRADE_ZONE","DEEMED_SUPPLY","PROFIT_MARGIN_SCHEME","SUMMARY_INVOICE","CONTINUOUS_SUPPLY","AGENT_BILLING","SUPPLY_THROUGH_ECOMMERCE","EXPORTS"]},"example":["FREE_TRADE_ZONE","CONTINUOUS_SUPPLY"]},"invoice_type_code":{"type":"string","description":"The UN/CEFACT document type code. See `GET /resources/invoice-types` for available values.","example":"380"},"issue_date":{"type":"string","format":"date","description":"The date on which the invoice was issued (YYYY-MM-DD). Must not be in the future and must not be more than 30 days in the past.","example":"2026-07-14"},"issue_time":{"type":"string","description":"The invoice issue time (HH:MM:SS)","example":"10:00:00"},"due_date":{"type":"string","format":"date","description":"The payment due date (YYYY-MM-DD)","example":"2026-08-13"},"document_currency_code":{"type":"string","description":"A code that specifies the currency in which the invoice is issued. See `GET /resources/currencies` for available values.","example":"AED"},"tax_currency_exchange_rate":{"type":"number","format":"double","description":"The exchange rate between document and tax currencies. Required and must be > 0 when `document_currency_code` is not `AED`. When `document_currency_code` is `AED`, must be `1` or omitted. Maximum 6 decimal places.","example":3.67},"customer_party_id":{"type":"string","description":"The DigiTax party ID of the buyer","example":"party_01HC3J1VVVM05YCTS61G7V3KC6"},"payee_party":{"$ref":"#/components/schemas/PayeeParty"},"tax_representative_party":{"$ref":"#/components/schemas/TaxRepresentativeParty"},"tax_point_date":{"type":"string","format":"date","description":"The VAT point date (YYYY-MM-DD). Must be strictly before the issue_date.","example":"2026-07-13"},"buyer_reference":{"type":"string","description":"An identifier assigned by the Buyer used for internal routing purposes.","example":"BR-2026-00789"},"accounting_cost":{"type":"string","description":"A textual value that specifies where to book the relevant data into the Buyer's financial accounts","example":"CAPEX-2024-Q4"},"project_reference":{"type":"string","description":"A project reference","example":"PROJ-JEBEL-2024"},"note":{"type":